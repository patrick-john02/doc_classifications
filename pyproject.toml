[project]
name = "intelligent-document-finetuning"
version = "0.1.0"
description = "Topic modeling and document-type classification models for the PAO document archiving system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "bertopic>=0.17.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.20.0",
]


#uv setup
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true


#pytorch index
[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]


