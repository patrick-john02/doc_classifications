# BERTopic settings. Final run: v4_clean_vocab (see notes/bertopic_runs.md)
# Script: scripts/topic_modeling/fit_bertopic.py
embedding_model: sentence-transformers/all-MiniLM-L6-v2
umap:
  n_neighbors: 15
  n_components: 5
  min_dist: 0.0
  metric: cosine
hdbscan:
  min_cluster_size: 10          # winner; script default is 15
  min_samples: 5
  metric: euclidean
  cluster_selection_method: eom
vectorizer:
  stop_words: english + custom (company names, OCR fragments)
  min_df: 2
  ngram_range: [1, 2]
ctfidf:
  reduce_frequent_words: true
seed: 42
